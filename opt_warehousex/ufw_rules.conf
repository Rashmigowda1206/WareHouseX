# UFW (Uncomplicated Firewall) Netfilter Configuration for WareHouseX
# Status: Active (Logging: On)
# Default Policies: Incoming DENY, Outgoing ALLOW, Routed DENY

# Hardened OpenSSH management port
22/tcp                     ALLOW IN    Anywhere                   (v4)
22/tcp (v6)                ALLOW IN    Anywhere (v6)

# WareHouseX REST API Daemon
5000/tcp                   ALLOW IN    192.168.1.0/24             (v4) # Local Subnet
5000/tcp                   ALLOW IN    127.0.0.1                  (v4) # Loopback

# WareHouseX Vite Web Interface
5173/tcp                   ALLOW IN    Anywhere                   (v4)
5173/tcp (v6)              ALLOW IN    Anywhere (v6)

# Reverse Proxy (Nginx / SSL)
80/tcp                     ALLOW IN    Anywhere                   (v4)
443/tcp                    ALLOW IN    Anywhere                   (v4)
