# LVM2 Logical Volume Storage Architecture - WareHouseX
# Storage Pool: vg_warehousex (Total: 70GB)

PV: /dev/sdb (40GB, Physical Drive Array 1)
PV: /dev/sdc (40GB, Physical Drive Array 2)
VG: vg_warehousex (80GB Total Extents)

LV: /dev/vg_warehousex/lv_opt
    Size:       20 GB
    Filesystem: ext4
    Mount:      /opt/warehousex
    Usage:      Production scripts, binaries, and daemon configurations

LV: /dev/vg_warehousex/lv_backups
    Size:       50 GB
    Filesystem: ext4
    Mount:      /var/backups/warehousex
    Usage:      TAR.GZ archives, SHA-256 checksum catalogs, restoration vault

LV: /dev/vg_warehousex/lv_logs
    Size:       10 GB
    Filesystem: ext4
    Mount:      /var/log/warehousex
    Usage:      Systemd logs, cron execution journals, audit trails
